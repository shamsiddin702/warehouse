<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inventarizatsiya &mdash; Stock Manager</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%232563eb'/><text y='.86em' x='50' text-anchor='middle' font-size='58'>&#128230;</text></svg>">
</head>
<body>
<div class="shell">

  <aside class="sidebar">
    <a class="brand" href="dashboard.html">
      <span class="brand__mark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8 4h8a1.8 1.8 0 0 1 1.8 1.8V6H6.2v-.2A1.8 1.8 0 0 1 8 4z"/>
          <rect x="3.5" y="6" width="17" height="14.5" rx="2.2"/>
          <path d="M9.5 11h5M9.5 14.5h5"/>
        </svg>
      </span>
      <span>
        <span class="brand__name">Stock Manager</span>
        <span class="brand__sub">Warehouse System</span>
      </span>
    </a>

    <nav class="nav" aria-label="Main">
      <a href="dashboard.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
        Dashboard
      </a>
      <a href="locations.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21V9l9-5 9 5v12"/><path d="M8 21v-7h8v7"/><path d="M3 21h18"/></svg>
        Warehouses
      </a>
      <a href="products.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2.8l8 4.2v9.9l-8 4.3-8-4.3V7z"/><path d="M4 7.1l8 4.2 8-4.2M12 11.3V21"/></svg>
        Products
      </a>
      <a href="stock.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5M3 17.5l9 5 9-5"/></svg>
        Stock Management
      </a>
      <a href="transfers.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h13l-3-3M20 16H7l3 3"/></svg>
        Transfers
      </a>
      <a href="reports.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
        Reports
      </a>
      <a href="expiry.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>
        Expiry &amp; Dead Stock
      </a>
      <a href="lowstock.html">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l9 16.5H3z"/><path d="M12 9.5v4.5M12 17v.2"/></svg>
        Low Stock
      </a>
      <a href="inventory.html" aria-current="page">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6v3H9z"/><path d="M9 5.5H6.5A1.5 1.5 0 0 0 5 7v12a1.5 1.5 0 0 0 1.5 1.5h11A1.5 1.5 0 0 0 19 19V7a1.5 1.5 0 0 0-1.5-1.5H15"/><path d="M9.5 13.5l2 2 4-4.5"/></svg>
        Inventarizatsiya
      </a>

      <a href="users.html" data-boss-only>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 5a3.5 3.5 0 0 1 0 7M21.5 20a6.5 6.5 0 0 0-4.5-6.2"/></svg>
        Foydalanuvchilar
      </a>
    </nav>

    <div class="side-foot">


      <button type="button" class="linkbtn" data-action="reset-demo">Reset demo data</button>
      <button type="button" class="linkbtn" data-auth-logout>Chiqish</button>
    </div>
  </aside>

  <div class="main">
    <div class="content" data-inventory>

      <div class="page-head">
        <div>
          <h1>Inventarizatsiya</h1>
          <p>Tizimdagi son bilan amaldagi sonni solishtirish — farq avtomatik hisoblanadi</p>
        </div>
        <div class="page-head__actions">
          <div class="tabs" role="tablist" aria-label="Inventarizatsiya bo‘limlari">
            <button type="button" role="tab" data-inv-tab="count" aria-selected="true">Yangi sanov</button>
            <button type="button" role="tab" data-inv-tab="history" aria-selected="false">Tarix</button>
          </div>
        </div>
      </div>

      <div data-inv-count>
        <div class="grid grid--4" data-inv-kpis></div>

        <div class="toolbar">
          <div class="search grow" style="max-width:380px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.6-3.6"/></svg>
            <label class="sr" for="invq">Qidirish</label>
            <input class="input" id="invq" type="search" data-search
                   placeholder="Mahsulot, brand yoki SKU...">
          </div>
          <select class="select select--auto" data-loc aria-label="Joylashuv bo‘yicha"></select>
          <div class="chipwrap">
            <button class="chip" type="button" data-flag="all" aria-pressed="true">Barchasi</button>
            <button class="chip" type="button" data-flag="counted" aria-pressed="false">Sanalgan</button>
            <button class="chip" type="button" data-flag="diff" aria-pressed="false">Farq bor</button>
          </div>
        </div>

        <div data-inv-table></div>

        <div class="inv-foot">
          <span class="inv-foot__hint" data-inv-hint></span>
          <span class="inv-foot__btns">
            <button class="btn btn--ghost" type="button" data-inv-apply-all disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
              Farqlarni tuzatish
            </button>
            <button class="btn btn--blue" type="button" data-inv-save disabled>
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/></svg>
              Saqlash
            </button>
          </span>
        </div>
      </div>

      <div data-inv-history hidden></div>

    </div>
  </div>
</div>

<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/auth.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
